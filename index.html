<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-secondary text-primary min-h-screen overflow-hidden">
    <div id="cursor"></div>
    
    <div id="overlay" class="fixed inset-0 bg-white flex justify-center items-center z-40">
        <h1 id="name" class="text-7xl font-bold"></h1>
    </div>
    
    <div id="background" class="fixed inset-0 z-0"></div>
    
    <div id="content" class="hidden relative z-10 p-8">
        <div id="about" class="bg-white rounded-lg p-8 mb-8 shadow-lg transform transition-transform duration-300">
            <h2 class="text-2xl font-bold mb-4">About</h2>
            <p>Your about content goes here.</p>
        </div>
        <div id="projects" class="bg-white rounded-lg p-8 shadow-lg transform transition-transform duration-300">
            <h2 class="text-2xl font-bold mb-4">Projects</h2>
            <p>Your projects content goes here.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

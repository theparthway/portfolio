<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Portfolio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-black text-white min-h-screen overflow-hidden cursor-none">
    <div class="cursor">
        <div class="cursor__ball cursor__ball--big">
            <svg height="30" width="30">
                <circle cx="15" cy="15" r="12" stroke-width="0"></circle>
            </svg>
        </div>
        
        <div class="cursor__ball cursor__ball--small">
            <svg height="10" width="10">
                <circle cx="5" cy="5" r="4" stroke-width="0"></circle>
            </svg>
        </div>
    </div>
    
    <div id="overlay" class="fixed inset-0 bg-black flex justify-center items-center z-40">
        <h1 id="name" class="text-7xl font-bold hoverable">Intro </h1>
    </div>
    
    <div id="background" class="fixed inset-0 z-0"></div>
    
    <div id="content" class="hidden relative z-10 p-8">
        <div id="about" class="bg-white text-black rounded-lg p-8 mb-12 shadow-lg transform transition-transform duration-300">
            <h2 class="text-2xl font-bold mb-4">About</h2>
            <p>Your about content goes here.</p>
        </div>
        <div id="projects-container" class="grid grid-cols-1 md:grid-cols-2 gap-8">
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
